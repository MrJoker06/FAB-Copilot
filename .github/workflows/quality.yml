name: Quality gate

on:
  push:
    branches: ["experiment/parallel-platform"]
  pull_request:
    branches: ["experiment/parallel-platform"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install deterministic visual fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-core fonts-noto-cjk
          fc-cache -f
      - name: Create fresh synthetic CI data
        run: python scripts/prepare_ci_data.py
      - name: Run full quality gate
        run: python scripts/run_quality_gate.py full
      - name: Upload safe diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            runtime/quality/
