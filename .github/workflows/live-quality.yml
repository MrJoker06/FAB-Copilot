name: Live E2E quality gate

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Published, compatibility-verified model catalog ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-e2e:
    name: Live E2E quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: live-e2e
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run full authorized Live E2E gate
        run: python scripts/run_quality_gate.py live
        env:
          FAB_LIVE_E2E_AUTHORIZED: "true"
          FAB_LIVE_E2E_TARGET: full
          FAB_LIVE_MODEL_ID: ${{ inputs.model_id }}
          FAB_MODEL_API_KEY: ${{ secrets.FAB_MODEL_API_KEY }}
      - name: Upload sanitized Live E2E metadata
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-metadata
          if-no-files-found: ignore
          retention-days: 14
          path: runtime/quality/live_e2e_report.json
